name: Build desktop release

# Pull requests: test and build all three apps (nothing is published).
# A tag v<version> matching samd_flasher/__init__.py VERSION: build, sign, and publish a release.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: Altitude SAMD21 Bootloader Flasher
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (simulated Atmel-ICE and SAMD21)
        run: python -m unittest discover -s tests -v
      - name: Tag matches the app version
        if: env.RELEASE_TAG != ''
        run: |
          VERSION="$(python -c 'import samd_flasher; print(samd_flasher.VERSION)')"
          if [ "$RELEASE_TAG" != "v$VERSION" ]; then
            echo "::error::Tag $RELEASE_TAG does not match samd_flasher VERSION $VERSION."; exit 1
          fi

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    environment: BOREALIS-Mac-OS
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            asset: SAMD21BootloaderFlasher-macOS.zip
          - name: Windows
            os: windows-latest
            asset: SAMD21BootloaderFlasher-Windows.zip
          - name: Raspberry Pi ARM64
            os: ubuntu-22.04-arm
            asset: SAMD21BootloaderFlasher-Raspberry-Pi-ARM64.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev zip xvfb
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build app (macOS)
        if: runner.os == 'macOS'
        run: >
          pyinstaller --noconfirm --windowed --name "$APP_NAME" --icon assets/icons/app_icon.icns
          --add-data "bootloaders:bootloaders" --add-data "assets:assets" bootloader_flasher.py
      - name: Build app (Windows)
        if: runner.os == 'Windows'
        run: >
          pyinstaller --noconfirm --onefile --windowed --name SAMD21BootloaderFlasher --icon assets/icons/app_icon.ico
          --add-data "bootloaders;bootloaders" --add-data "assets;assets" bootloader_flasher.py
      - name: Build app (Raspberry Pi)
        if: runner.os == 'Linux'
        run: >
          pyinstaller --noconfirm --onefile --windowed --name SAMD21BootloaderFlasher
          --add-data "bootloaders:bootloaders" --add-data "assets:assets" bootloader_flasher.py

      - name: Self-test (macOS)
        if: runner.os == 'macOS'
        run: '"dist/$APP_NAME.app/Contents/MacOS/$APP_NAME" --self-test'
      - name: Self-test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:FLASHER_SELFTEST_LOG = "$env:RUNNER_TEMP\selftest.log"
          $p = Start-Process -FilePath "dist\SAMD21BootloaderFlasher.exe" -ArgumentList "--self-test" -Wait -PassThru
          if (Test-Path $env:FLASHER_SELFTEST_LOG) { Get-Content $env:FLASHER_SELFTEST_LOG }
          if ($p.ExitCode -ne 0) { throw "Self-test failed with exit code $($p.ExitCode)" }
      - name: Self-test (Raspberry Pi)
        if: runner.os == 'Linux'
        run: xvfb-run -a dist/SAMD21BootloaderFlasher --self-test

      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS' && env.RELEASE_TAG != ''
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          APP="dist/$APP_NAME.app"
          if [ -z "$MACOS_CERTIFICATE_BASE64" ]; then
            echo "::warning::No Developer ID certificate; the macOS app is ad-hoc signed and macOS will warn users."
            codesign --force --deep --sign - "$APP"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -n 1)"
          if [ -z "$IDENTITY" ]; then echo "::error::No Developer ID Application identity in the certificate."; exit 1; fi
          codesign --force --deep --options runtime --timestamp --sign "$IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" notary-submit.zip
          xcrun notarytool submit notary-submit.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          "$APP/Contents/MacOS/$APP_NAME" --self-test

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "dist/$APP_NAME.app" "${{ matrix.asset }}"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/SAMD21BootloaderFlasher.exe -DestinationPath "${{ matrix.asset }}" -Force
      - name: Package (Raspberry Pi)
        if: runner.os == 'Linux'
        run: |
          cp packaging/install.sh packaging/99-altitude-samd-flasher.rules dist/
          cp assets/icons/app_icon.png dist/samd21-bootloader-flasher.png
          (cd dist && zip "../${{ matrix.asset }}" SAMD21BootloaderFlasher install.sh 99-altitude-samd-flasher.rules samd21-bootloader-flasher.png)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/*/*.zip \
            --title "$APP_NAME $RELEASE_TAG" --notes-file RELEASE_NOTES.md
